services:
  - type: web
    name: flask-email-automation
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        value: "12345abced"
      - key: OAUTHLIB_INSECURE_TRANSPORT
        value: 1
    autoDeploy: true
